<!DOCTYPE html>
<html>
<head>
    <title>radio</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<center>

<h1>radio</h1>

<p><small>tap a station to play. tap again to stop.</small></p>

<div id="now-playing"></div>

<div id="station-list">
    <div class="station" data-stream="https://tektite.streamguys1.com:5145/wwnolive" data-name="wwno news">
        <span class="station-name">wwno news</span>
        <span class="station-desc">88.3 fm · new orleans npr</span>
    </div>
    <div class="station" data-stream="https://tektite.streamguys1.com:5145/wwnoclassical" data-name="wwno classical">
        <span class="station-name">wwno classical</span>
        <span class="station-desc">new orleans classical</span>
    </div>
    <div class="station" data-stream="https://tektite.streamguys1.com:5145/wwnojazz" data-name="wwno jazz">
        <span class="station-name">wwno jazz</span>
        <span class="station-desc">new orleans jazz</span>
    </div>
    <div class="station" data-stream="https://streams.kqed.org/kqedradio" data-name="kqed">
        <span class="station-name">kqed</span>
        <span class="station-desc">88.5 fm · san francisco npr</span>
    </div>
    <div class="station-iframe">
        <div class="station-iframe-label">
            <span class="station-name">wqxr</span>
            <span class="station-desc">105.9 fm · new york classical</span>
        </div>
        <iframe frameborder="0" height="193px" src="https://www.wqxr.org/widgets/embeddable_player/?stream=wqxr#showPlaylist=false" width="300px"></iframe>
    </div>
    <div class="station" data-stream="https://wwoz-sc.streamguys1.com/wwoz-hi.mp3" data-name="wwoz">
        <span class="station-name">wwoz</span>
        <span class="station-desc">90.7 fm · new orleans jazz</span>
    </div>
    <div class="station" data-stream="https://live.kmhd.org/kmhd128.mp3" data-name="kmhd">
        <span class="station-name">kmhd</span>
        <span class="station-desc">89.1 fm · portland jazz</span>
    </div>
</div>

<p id="status"></p>

</center>

<audio id="player" preload="none"></audio>

<script src="radio.js"></script>

</body>
</html>
